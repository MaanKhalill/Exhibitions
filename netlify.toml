# Netlify deploy config for this Vite SPA.
[build]
  command = "npm run build"
  publish = "dist"

# Single-page-app fallback: serve index.html for client-side routes.
# (Netlify serves real static files first, so /assets/* still resolve.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
